version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: nagardrishti_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nagardrishti}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeMeSecurePassword2026!}
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nagardrishti"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nagardrishti_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-ChangeMeSecurePassword2026!}@db:5432/${POSTGRES_DB:-nagardrishti}
      ENVIRONMENT: production
      DEBUG: "false"
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nagardrishti_frontend
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"
    deploy:
      resources:
        limits:
          memory: 512M

  gateway:
    image: nginx:1.25-alpine
    container_name: nagardrishti_gateway
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/gateway.conf:/etc/nginx/nginx.conf:ro
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  postgis_data:
    driver: local

