[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nagardrishti-backend"
version = "1.0.0"
description = "NagarDrishti — Geospatial Urban Civic Intelligence & Multilingual Feedback Platform Backend"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "geoalchemy2>=0.14.4",
    "psycopg[binary]>=3.1.0",
    "shapely>=2.0.3",
    "pyproj>=3.6.1",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "pyjwt[crypto]>=2.8.0",
    "python-dotenv>=1.0.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=4.1.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
